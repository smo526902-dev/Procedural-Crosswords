[project]
name = "procedural-crosswords"
version = "0.1.0"
description = "Generate American-style crosswords with adjustable difficulty, plus a web solver."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
# Only needed to rebuild data/wordlist.tsv.gz
build = ["nltk>=3.8", "wordfreq>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "puzpy>=0.2"]

[tool.setuptools]
packages = ["crossword", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
